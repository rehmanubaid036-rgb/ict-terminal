[project]
name = "ictengine"
version = "0.1.0"
description = "ICT Project engine: time engine, ICT indicators, models, backtest"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2", "numpy>=1.26", "tzdata"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ictengine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
